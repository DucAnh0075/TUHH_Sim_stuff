<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-tuhh-v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>not yabs</title>
    <script>
      // Set the theme before first paint to avoid a flash of the wrong colours.
      // Default is light; dark only when the user has explicitly chosen it.
      try {
        if (localStorage.getItem('es-exam-trainer:theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
